[project]
name = "itmo-mlops-hw1-toolchain"
version = "0.1.0"
description = "ITMO MLOps Basic HW1: reproducible Python project with uv, Ruff, ty"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.13,<0.19", "ty>=0.0.50,<0.1", "pytest>=8,<10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
