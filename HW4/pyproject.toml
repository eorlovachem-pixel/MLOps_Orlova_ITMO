[project]
name = "itmo-mlops-hw4-testing"
version = "0.1.0"
description = "ITMO MLOps Basic HW4: unit, integration and end-to-end ML pipeline tests"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<0.19", "ty>=0.0.50,<0.1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "unit: tests for isolated feature/model/data/training modules",
  "integration: tests for two or more pipeline components",
  "e2e: tests for complete CLI pipeline from raw data to metrics",
]

[tool.ty.environment]
python-version = "3.13"
